services:
  boomboom:
    build:
      context: .
      args:
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun}
        BUN_VERSION: ${BUN_VERSION:-1.3.4}
    container_name: boomboom-news
    ports:
      - "3210:3210"
    environment:
      API_PORT: "3210"
      HOST: 0.0.0.0
      DATA_DIR: /data
      SQLITE_PATH: /data/boomboom.sqlite
      WATCHLIST_SYMBOLS: ${WATCHLIST_SYMBOLS:-}
      DATA_REFRESH_SECONDS: ${DATA_REFRESH_SECONDS:-600}
      OPEN_DATA_TIMEOUT_SECONDS: ${OPEN_DATA_TIMEOUT_SECONDS:-8}
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ['CMD', 'bun', '-e', "const r=await fetch('http://127.0.0.1:3210/api/health');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
